<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Proposal 4: Terminal/Command prompt style -->
  <rect width="32" height="32" fill="#0a192f" rx="6"/>
  <!-- Terminal prompt symbol -->
  <g fill="none" stroke="#64ffda" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <!-- Angle bracket (>) -->
    <polyline points="9,10 14,16 9,22"/>
  </g>
  <!-- Cursor/underscore -->
  <rect x="16" y="20" width="7" height="2.5" fill="#64ffda" rx="1"/>
</svg>
