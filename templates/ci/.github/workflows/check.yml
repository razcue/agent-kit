name: check

on:
  push:
    branches: [__MAIN__]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # preflight compares against the base branch
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: preflight
        run: npx --yes @razcue/agent-kit preflight origin/${{ github.base_ref || '__MAIN__' }}
